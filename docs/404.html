<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Hariraj</title>
<link rel="icon" id="fav" href="assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Jost:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2a1612,#140d0b 70%);color:#f6ead7;font-family:Jost,system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-family:"Cormorant Garamond",serif;font-size:clamp(2.4rem,7vw,4rem);margin:.2em 0}
  h1 em{color:#e6b562}
  p{color:#bba993}.hi{font-family:"Tiro Devanagari Hindi",serif;color:#f28c28;font-size:1.2rem}
  a{display:inline-block;margin-top:24px;padding:14px 28px;border-radius:999px;background:linear-gradient(135deg,#f28c28,#e3263f);color:#fff;text-decoration:none;font-weight:500}
</style>
</head>
<body><main><p class="hi">अरे! यह पेज नहीं मिला</p><h1>This plate is <em>empty</em>.</h1><p>The page you were looking for isn’t on our menu.</p><a id="home" href="./">Back to Hariraj</a></main>
<script>
  // Works both on a custom domain and on username.github.io/repo-name/
  (function () {
    var seg = location.pathname.split("/")[1];
    var base = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
    document.getElementById("home").href = base;
    document.getElementById("fav").href = base + "assets/img/favicon.svg";
  })();
</script>
</body>
</html>
